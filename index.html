<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小红书标题生成器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="tag">新手友好的网页小项目</p>
      <h1>小红书标题生成器</h1>
      <p class="intro">输入一个选题，一键生成 5 个更吸引人的小红书风格标题。</p>

      <div class="generator-card">
        <label for="topicInput">你的选题</label>
        <div class="input-row">
          <input id="topicInput" type="text" placeholder="例如：西瓜怎么挑" autocomplete="off">
          <button id="generateButton" type="button">生成标题</button>
        </div>
        <p class="hint">可以输入生活技巧、学习方法、美食探店、穿搭护肤等主题。</p>
      </div>
    </section>

    <section class="results-card" aria-live="polite">
      <div class="results-header">
        <h2>生成结果</h2>
        <span>5 个标题</span>
      </div>
      <ol id="titleList" class="title-list">
        <li>先输入一个选题，然后点击“生成标题”。</li>
      </ol>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
